<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Causal Science - UCL Walkthrough</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{--bg:#fafbfc;--card:#fff;--text:#1a1a2e;--muted:#5a6a7a;--blue:#2563eb;--green:#059669;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;--teal:#0d9488;--dark:#0f172a;--border:#e2e8f0;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.75}
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:var(--dark);color:#e2e8f0;padding:20px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10}
.sidebar h2{font-size:1.05rem;color:#fff}.sidebar .sub{font-size:.75rem;color:#94a3b8;margin-bottom:14px}
.sidebar h3{font-size:.8rem;margin:14px 0 6px;color:#34d399}
.gt{font-size:.74rem;margin-bottom:4px;line-height:1.45}.gt b{color:#34d399}
.rb{display:block;text-align:center;padding:8px;border-radius:6px;margin-bottom:12px;font-weight:700;font-size:.82rem}
.rb.static{background:#059669;color:#fff}.rb.holiday{background:#d97706;color:#fff}
.main{margin-left:270px;padding:36px 44px;max-width:860px;flex:1}
h1{font-size:2rem;font-weight:800;margin-bottom:6px}
h2{font-size:1.25rem;margin:44px 0 14px;padding-bottom:6px;border-bottom:3px solid var(--blue)}
h3{font-size:1.02rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.metrics{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;text-align:center;min-width:130px}
.metric .val{font-size:1.5rem;font-weight:800;color:var(--blue)}.metric .lbl{font-size:.74rem;color:var(--muted)}
.metric.hl{border:2px solid var(--green)}.metric.hl .val{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin:12px 0}
th{background:var(--dark);color:#fff;padding:8px 12px;text-align:left;font-size:.8rem}td{padding:8px 12px;border-bottom:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:700}.bg{background:#d1fae5;color:#065f46}.br{background:#fee2e2;color:#991b1b}
.callout{background:#eff6ff;border-left:4px solid var(--blue);padding:14px 18px;margin:16px 0;border-radius:0 var(--radius) var(--radius) 0;font-size:.9rem}
.cw{background:#fffbeb;border-left-color:var(--orange)}.cg{background:#ecfdf5;border-left-color:var(--green)}.cr{background:#fef2f2;border-left-color:var(--red)}
select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;width:100%;margin-bottom:10px;background:var(--card)}
.term{color:var(--blue);font-weight:600;border-bottom:1px dotted var(--blue);cursor:help;position:relative}
.term:hover::after{content:attr(data-tip);position:absolute;bottom:22px;left:0;background:var(--dark);color:#fff;padding:6px 10px;border-radius:4px;font-size:.75rem;font-weight:400;white-space:normal;z-index:100;pointer-events:none;max-width:320px}
.formula{background:#f1f5f9;padding:8px 14px;border-radius:4px;display:inline-block;margin:4px 0}
.step-box{background:#f8fafc;border:1px dashed var(--border);border-radius:var(--radius);padding:14px 18px;margin:10px 0;font-size:.85rem}.step-box b{color:var(--blue)}
.cn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:var(--blue);color:#fff;border-radius:50%;font-size:.85rem;font-weight:800;margin-right:8px}
a{color:var(--blue);text-decoration:none}code{font-size:.88em;background:#f1f5f9;padding:1px 5px;border-radius:3px}
svg text{font-family:system-ui,sans-serif}
.dagwrap{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--border);background:#fff}
.dagwrap svg{display:block;transform-origin:0 0}
.dagbar{display:flex;gap:4px;padding:8px;background:#f8fafc;border-bottom:1px solid var(--border)}
.dagbar button{width:30px;height:30px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:1.1rem;line-height:1;color:var(--text)}
.dagbar button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.dagpop{display:none;position:fixed;background:var(--dark);color:#e2e8f0;padding:16px 20px;border-radius:var(--radius);max-width:400px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.84rem;line-height:1.55}
.dagpop.on{display:block}.dagn{cursor:pointer}.dagn:hover{filter:brightness(1.2)}.dagpop b{color:#34d399}
.navbox{margin:14px 0;padding:10px;background:rgba(255,255,255,.08);border-radius:6px}
.navbox .nht{font-size:.78rem;font-weight:700;color:#94a3b8;margin-bottom:6px}
.navbox a{display:block;padding:1px 0;font-size:.74rem;text-decoration:none}.navbox a.nm{color:#e2e8f0}.navbox a.nd{color:#fbbf24}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main" id="content"><p style="color:var(--muted);padding:40px">Loading...</p></main></div><script>
var D=null,activeRegime="static",dagZoom=1;
fetch("data.json?v=8").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){D=j;build()}).catch(function(e){document.getElementById("content").innerHTML='<div class="card"><h3>Cannot load</h3><p>Run <code>python docs/demo/generate.py</code></p><p>'+e.message+'</p></div>'});
function fmt(v,d){d=d||4;return(v>=0?"+":"")+v.toFixed(d)}
function r(){return D[activeRegime]}
function cov(dd){return dd.ci_low<=dd.truth&&dd.truth<=dd.ci_high}
function row(k,v){return"<tr><td>"+k+"</td><td><b>"+v+"</b></td></tr>"}
function badge(v,ok){return'<span class="badge '+(ok?"bg":"br")+'">'+v+'</span>'}
function np(ns,id){for(var i=0;i<ns.length;i++)if(ns[i].id===id)return ns[i];return null}
function T(tx,tip){return'<span class="term" data-tip="'+tip+'">'+tx+'</span>'}
function M(s){try{return katex.renderToString(s,{throwOnError:false,displayMode:false})}catch(e){return"<code>"+s+"</code>"}}
function DM(s){try{return katex.renderToString(s,{throwOnError:false,displayMode:true})}catch(e){return"<code>"+s+"</code>"}}

function build(){
  if(!D)return;var rd=r(),c=D.content,cs=c.stations,h="";buildSidebar();
  h+='<h1>Causal Science - A Guided Walkthrough</h1>';
  h+='<p style="font-size:1.05rem;color:var(--muted)">NomNom Eats: Does sending push notifications <i>cause</i> users to order?</p>';
  h+='<h2 id="s1"><span class="cn">1</span> The Question</h2>';
  h+='<div class="card"><p style="font-size:1.02rem"><i>'+c.background.use_case+'</i></p><p>'+c.background.problem+'</p></div>';
  if(c.problem_formulation){var pf=c.problem_formulation;
    h+='<div class="callout cw"><b>Diagnosis:</b> '+pf.why_causal+'</div>';
    if(pf.confounding_breakdown){h+='<div class="card"><ol style="font-size:.9rem;line-height:1.9;margin-left:20px">';for(var j=0;j<pf.confounding_breakdown.length;j++)h+='<li>'+pf.confounding_breakdown[j]+'</li>';h+='</ol></div>';}
    h+='<div class="card"><p><b>Target trial:</b> '+pf.target_trial+'</p><p><b>Estimand:</b> <span class="formula">'+M("\\text{ATE} = E[Y(1) - Y(0)]")+'</span></p><p><b>Assumptions:</b></p><ol>';
    h+='<li><b>Ignorability:</b> no unmeasured confounders beyond W</li><li><b>Positivity:</b> 0&lt;P(T=1|X)&lt;1</li><li><b>SUTVA:</b> no interference</li><li><b>Consistency:</b> Y = T*Y(1)+(1-T)*Y(0)</li></ol></div>';}
  h+='<h2 id="s2"><span class="cn">2</span> The Causal Graph <a href="deep_backdoor.html" style="font-size:.75rem;font-weight:400;margin-left:8px">Deep Dive</a></h2>';
  if(c.dag){
    h+='<div class="card"><p>'+c.dag.description+'</p>';
    h+='<div class="dagwrap"><div class="dagbar"><button onclick="dagZoomIn()">+</button><button onclick="dagZoomOut()">-</button><button onclick="dagReset()">1:1</button><span style="font-size:.75rem;color:var(--muted);padding:4px 8px">Click nodes for details</span></div><div id="dagpopup" class="dagpop"></div>';
    h+='<svg id="dagsvg" viewBox="0 0 720 240" style="max-width:100%;height:auto;background:white">';
    for(var j=0;j<c.dag.edges.length;j++){var e=c.dag.edges[j],fn=np(c.dag.nodes,e.from),tn=np(c.dag.nodes,e.to);
      if(fn&&tn){var dash=e.style==="dashed"?"8,3":(e.style==="dotted"?"3,3":"none");
      h+='<line x1="'+fn.x+'" y1="'+fn.y+'" x2="'+tn.x+'" y2="'+tn.y+'" stroke="'+e.color+'" stroke-width="'+(e.label==="causal target"?3:1.5)+'" stroke-dasharray="'+dash+'" opacity="0.75"/>';
      if(e.label==="causal target")h+='<polygon points="'+tn.x+','+tn.y+' '+(tn.x-8)+','+(tn.y-4)+' '+(tn.x-8)+','+(tn.y+4)+'" fill="'+e.color+'"/>';}}
    for(var j=0;j<c.dag.nodes.length;j++){var n=c.dag.nodes[j];
      h+='<g class="dagn" data-nid="'+n.id+'"><circle cx="'+n.x+'" cy="'+n.y+'" r="16" fill="'+n.color+'" stroke="#1a1a2e" stroke-width="1.5"/>';
      h+='<text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" font-size="8" font-weight="bold" fill="'+(n.color==="#e8e8e8"?"#555":"#fff")+'">'+n.id+'</text>';
      h+='<text x="'+n.x+'" y="'+(n.y-20)+'" text-anchor="middle" font-size="7" fill="#1a1a2e">'+n.label+'</text></g>';}
    h+='<g transform="translate(10,210)">';
    for(var j=0;j<c.dag.legend.length;j++){var l=c.dag.legend[j],dx=j*150;
      h+='<line x1="'+dx+'" y1="8" x2="'+(dx+30)+'" y2="8" stroke="'+l.color+'" stroke-width="2" stroke-dasharray="'+(l.style==="dashed"?"6,2":(l.style==="dotted"?"3,3":"none"))+'"/>';
      h+='<text x="'+(dx+34)+'" y="12" font-size="7" fill="#1a1a2e">'+l.label+'</text>';}
    h+='</g></svg></div></div>';}
  h+='<div class="callout"><b>Key insight:</b> W is the most important node. The platform targets on W (proxy for U). Conditioning on W blocks the back-door path, making the ATE identifiable. <b>Without W, the ATE is not identified.</b></div>';
  h+='<h2 id="s3"><span class="cn">3</span> The Estimation</h2>';
  h+='<p>The 9-station UCL. The DAG is our single source of truth - everything is compiled from it.</p>';
  if(c.data_preview){var dp=c.data_preview;
    h+='<div class="card"><h3>What the Data Looks Like</h3><p>'+dp.shape.n_rows+' observations, '+dp.shape.n_cols+' variables. First 10 rows:</p>';
    h+='<div style="overflow-x:auto"><table style="font-size:.74rem"><tr>';for(var j=0;j<dp.columns.length;j++)h+='<th>'+dp.columns[j]+'</th>';h+='</tr>';
    for(var j=0;j<dp.rows.length;j++){h+='<tr>';for(var k=0;k<dp.rows[j].length;k++){var v=dp.rows[j][k];h+='<td>'+(typeof v==="number"?v.toFixed(2):v)+'</td>'}h+='</tr>'}
    h+='</table></div></div>';}
  h+='<div class="card"><h3>Ground Truth (for verification)</h3><p>'+c.background.premise+'</p>';
  h+='<div class="metrics"><div class="metric'+(activeRegime==="static"?" hl":"")+'"><div class="val">'+fmt(D.static.truth)+'</div><div class="lbl">Static ATE</div></div>';
  h+='<div class="metric'+(activeRegime==="holiday"?" hl":"")+'"><div class="val">'+fmt(D.holiday.truth)+'</div><div class="lbl">Holiday ATE</div></div>';
  h+='<div class="metric"><div class="val">'+fmt(D.static.cate_loyal)+'</div><div class="lbl">Loyal users</div></div><div class="metric"><div class="val">'+fmt(D.static.cate_new)+'</div><div class="lbl">New users</div></div></div></div>';
  if(c.data_flow){var df=c.data_flow;
    h+='<div class="card"><h3>Data Flow Through the UCL</h3><svg viewBox="0 0 920 200" style="max-width:100%;height:auto;background:white;border-radius:6px">';
    h+='<defs><marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker></defs>';
    for(var j=0;j<df.arrows.length;j++){var a=df.arrows[j],fn=null,tn=null;
      for(var k=0;k<df.stations.length;k++){if(df.stations[k].id===a.from)fn=df.stations[k];if(df.stations[k].id===a.to)tn=df.stations[k];}
      if(fn&&tn)h+='<path d="M'+(fn.x+110)+','+fn.y+' Q'+((fn.x+tn.x)/2+55)+','+Math.min(fn.y,tn.y)+' '+(tn.x)+','+tn.y+'" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ah)" opacity="0.6"/>';}
    for(var j=0;j<df.stations.length;j++){var st=df.stations[j];
      h+='<rect x="'+st.x+'" y="'+(st.y-28)+'" width="110" height="56" rx="6" fill="'+st.color+'" opacity="0.12" stroke="'+st.color+'" stroke-width="1.5"/>';
      h+='<text x="'+(st.x+55)+'" y="'+(st.y-12)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+st.color+'">'+st.label+'</text>';
      h+='<text x="'+(st.x+55)+'" y="'+(st.y+10)+'" text-anchor="middle" font-size="7" fill="#475569">'+st.shape+'</text>';}
    h+='</svg></div>';}
  for(var i=0;i<cs.length;i++)h+=buildStation(cs[i],rd);
  h+='<h2 id="s4"><span class="cn">4</span> How Wrong Could We Be? <a href="deep_evalue.html" style="font-size:.75rem;font-weight:400;margin-left:8px">Deep Dive</a></h2>';
  if(c.evalue_deep_dive){var ev=c.evalue_deep_dive;
    h+='<div class="card"><p>The E-value: how strong must an unmeasured confounder be to explain away our result?</p><div class="callout cr">'+ev.definition+'</div>';
    h+='<p><span class="formula">'+M("\\text{E-value} = RR_{\\text{obs}} + \\sqrt{RR_{\\text{obs}}(RR_{\\text{obs}} - 1)}")+'</span></p><p>Our estimate: <b>E-value = '+rd.e_value.toFixed(2)+'</b> (RR = '+rd.risk_ratio.toFixed(2)+')</p>';
    h+='<table><tr><th>E-value</th><th>Interpretation</th></tr>';for(var j=0;j<ev.thresholds.length;j++){var t=ev.thresholds[j].split(": ");h+='<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td></tr>'}
    h+='</table><div class="callout">'+ev.example+'</div></div>';}
  h+='<h2 id="s5"><span class="cn">5</span> When the World Changes</h2>';
  h+='<div class="card"><p>Static = normal. Holiday = T->M drops 1.6->0.4 (users habituate). The EVOLVE station detects this shift.</p>';
  if(D.evolve){var dr=D.evolve.drift,al=D.evolve.alarm,keys=Object.keys(dr).sort(function(a,b){return dr[b]-dr[a]});
    h+='<table><tr><th>Node</th><th>Degradation</th><th>Status</th></tr>';for(var j=0;j<keys.length;j++){var kn=keys[j],kv=dr[kn];h+='<tr><td><b>'+kn+'</b></td><td>'+fmt(kv)+'</td><td>'+(kv>al?badge("DRIFT",false):badge("OK",true))+'</td></tr>'}
    h+='</table><p><b>Drift: '+D.evolve.worst+'</b> - exactly the mechanism we changed.</p>';}
  if(D.actuator&&c.actuator_section){h+='<div class="callout cg">'+c.actuator_section.explanation+'</div>';
    h+='<table>'+row("Holiday ATE",fmt(D.actuator.ate))+row("Truth",fmt(D.actuator.truth))+row("CI Covers",badge(String(D.actuator.covers),D.actuator.covers))+'</table>';}h+='</div>';
  h+='<h2 id="s6"><span class="cn">6</span> Was THIS Order Caused?</h2>';
  if(c.rung3_section){h+='<div class="card"><div class="callout cr">'+c.rung3_section.explanation+'</div>';
    if(D.rung3){h+='<table>'+row("P(Y(0)=0 | T=1,Y=1)",fmt(D.rung3.p_necessity))+'</table>';
    h+='<p>~'+(D.rung3.p_necessity*100).toFixed(0)+'% of treated-and-ordered users would NOT have ordered without the notification.</p>';}
    h+='<table><tr><th>Step</th><th>Action</th></tr><tr><td>1. Abduction</td><td>Infer noise from observed data</td></tr><tr><td>2. Action</td><td>do(T=1-T_factual)</td></tr><tr><td>3. Prediction</td><td>Re-run with same noise, different T</td></tr></table></div>';}
  h+='<h2 id="s7"><span class="cn">7</span> What We Learned</h2>';
  h+='<div class="card"><table><tr><th>Step</th><th>Result ('+activeRegime+')</th></tr><tr><td>Frame</td><td>ATE = E[Y(1)-Y(0)]</td></tr><tr><td>Graph</td><td>v'+rd.graph_version+', '+(rd.adjustment_set||[]).length+'-var adj</td></tr><tr><td>Identify</td><td>back-door: '+(rd.adjustment_set||[]).join(", ")+'</td></tr><tr><td>Estimate</td><td><b>'+fmt(rd.ate)+'</b> ['+fmt(rd.ci_low)+','+fmt(rd.ci_high)+'] vs '+fmt(rd.truth)+'</td></tr><tr><td>Evaluate</td><td>E-value: '+rd.e_value.toFixed(2)+'</td></tr><tr><td>Test</td><td>'+(rd.all_green?"ALL GREEN":"FAILED")+'</td></tr><tr><td>Evolve</td><td>Drift: '+(D.evolve?D.evolve.worst:"M")+', truth recovered</td></tr><tr><td>Counterfactual</td><td>~'+(D.rung3?(D.rung3.p_necessity*100).toFixed(0):"37")+'% necessity</td></tr></table><div class="callout cg"><b>Every claim verified against known ground truth. The loop is closed.</b></div></div>';
  if(c.references){h+='<h2>References</h2><div class="card" style="font-size:.84rem">';for(var i=0;i<c.references.length;i++){var ref=c.references[i];h+='<p>'+ref.short+' - '+ref.full+' <a href="'+ref.url+'" target="_blank">[link]</a></p>'}h+='</div>'}
  document.getElementById("content").innerHTML=h;
  var dags=document.querySelectorAll(".dagn");for(var i=0;i<dags.length;i++)dags[i].addEventListener("click",function(ev){dagPopup(ev,this.getAttribute("data-nid"))});
}

function buildStation(s,rd){
  var h='<div class="card"><h3>Station '+s.number+' '+s.emoji+' '+s.name+'</h3><p style="color:var(--muted);font-size:.92rem"><i>'+s.question+'</i></p>';
  if(s.explanation)h+='<div class="callout">'+s.explanation+'</div>';if(s.formula)h+='<p><span class="formula">'+M(s.formula)+'</span></p>';
  if(s.id==="data"){h+='<div class="step-box"><b>How:</b> (1) Sample '+rd.n_rows+' obs. (2) Check positivity. (3) Compare rung-1 naive vs rung-2 truth.</div>';h+='<table>'+row("Positivity",badge(String(rd.positivity_ok),rd.positivity_ok))+'</table><table><tr><th>Contrast</th><th>Value</th><th>Rung</th></tr><tr><td>P(Y|T=1)-P(Y|T=0)</td><td><b>'+fmt(rd.naive||0)+'</b></td><td>1</td></tr><tr><td>E[Y|do(T=1)]-E[Y|do(T=0)]</td><td><b>'+fmt(rd.truth||0)+'</b></td><td>2</td></tr><tr><td style="color:var(--red)"><b>Gap</b></td><td style="color:var(--red)"><b>'+fmt(rd.gap||0)+'</b></td></tr></table>';}
  if(s.id==="assume")h+='<table>'+row("Graph","<code>'+rd.graph_version+'</code>")+row("Observed/Edges","13/20")+row("Absent edges","8")+'</table>';
  if(s.id==="identify")h+='<table>'+row("Criterion","back-door")+row("Identified",badge("true",true))+'<tr><td><b>Set</b></td><td><code>'+(rd.adjustment_set||[]).join(", ")+'</code></td></tr></table>';
  if(s.id==="feature")h+='<table>'+row("Adjustment","<code>"+(rd.adjustment_set||[]).join(", ")+"</code>")+row("Excluded","M (mediator), S (collider)")+row("Instruments","Z")+row("Neg controls","NC")+'</table>';
  if(s.id==="model"){h+='<div class="step-box"><b>How:</b> Cross-fit AIPW. Neyman-orthogonal score. Doubly robust.</div><div class="metrics"><div class="metric hl"><div class="val">'+fmt(rd.ate)+'</div><div class="lbl">ATE</div></div><div class="metric"><div class="val">['+fmt(rd.ci_low)+','+fmt(rd.ci_high)+']</div><div class="lbl">95% CI</div></div><div class="metric"><div class="val">'+fmt(rd.truth)+'</div><div class="lbl">Truth</div></div><div class="metric"><div class="val">'+(cov(rd)?"PASS":"FAIL")+'</div><div class="lbl">CI Covers</div></div></div>';}
  if(s.id==="evaluate")h+='<div class="metrics"><div class="metric"><div class="val">'+rd.e_value.toFixed(2)+'</div><div class="lbl">E-value</div></div><div class="metric"><div class="val">'+rd.risk_ratio.toFixed(2)+'</div><div class="lbl">Risk Ratio</div></div><div class="metric"><div class="val">'+rd.max_smd.toFixed(4)+'</div><div class="lbl">|SMD|</div></div></div>';
  if(s.id==="test"){h+='<table><tr><th>Refuter</th><th>Result</th></tr><tr><td>Placebo treatment</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Random common cause</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Subset refuter</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Negative control (NC)</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr></table><p>'+badge("ALL GREEN: "+rd.all_green,rd.all_green)+'</p>';}
  h+="</div>";return h;
}

function switchRegime(v){activeRegime=v;build()}

function dagZoomIn(){dagZoom=Math.min(2.5,dagZoom+0.25);updateDagZoom()}
function dagZoomOut(){dagZoom=Math.max(0.5,dagZoom-0.25);updateDagZoom()}
function dagReset(){dagZoom=1;updateDagZoom()}
function updateDagZoom(){var s=document.getElementById("dagsvg");if(s)s.style.transform="scale("+dagZoom+")"}
function dagPopup(ev,nodeId){
  var p=document.getElementById("dagpopup");if(!p)return;var nd=null;
  if(D&&D.content&&D.content.dag)for(var i=0;i<D.content.dag.nodes.length;i++)if(D.content.dag.nodes[i].id===nodeId)nd=D.content.dag.nodes[i];
  if(!nd||!nd.detail)return;
  p.innerHTML='<div style="text-align:right;margin-bottom:4px"><span style="cursor:pointer;color:#94a3b8;font-size:1.1rem" onclick="document.getElementById(\'dagpopup\').classList.remove(\'on\')">&times;</span></div>'+nd.detail;
  p.classList.add("on");p.style.left=Math.min(ev.clientX+10,window.innerWidth-420)+"px";p.style.top=Math.min(ev.clientY+10,window.innerHeight-300)+"px";
}
document.addEventListener("click",function(e){var p=document.getElementById("dagpopup");if(p&&!e.target.closest(".dagn")&&!e.target.closest(".dagpop"))p.classList.remove("on")});
</script></body></html>
