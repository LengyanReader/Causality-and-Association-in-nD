<style>

a{color:var(--blue);text-decoration:none}code{font-size:.88em;background:#f1f5f9;padding:1px 5px;border-radius:3px}
svg text{font-family:system-ui,sans-serif}

.graph-panel{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:grab;user-select:none}

.think-chain{display:flex;align-items:center;gap:10px;margin:0;padding:10px 16px;background:linear-gradient(90deg,rgba(124,58,237,.04),rgba(124,58,237,.08),rgba(124,58,237,.04));border:1px dashed rgba(124,58,237,.25);border-radius:var(--radius);font-size:.82rem;color:var(--muted)}

.think-layer.l1 .lvl-dot{background:#2563eb}.think-layer.l2 .lvl-dot{background:#059669}
.think-layer.l3 .lvl-dot{background:#d97706}.think-layer.l4 .lvl-dot{background:#7c3aed}
.think-layer.l5 .lvl-dot{background:#dc2626}
/* Hero quote */
.hero-quote{background:linear-gradient(135deg,#eff6ff,#f8fafc);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:var(--radius);padding:22px 26px;margin:18px 0}

.roadmap-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;background:#f8fafc;border-radius:6px;font-size:.8rem;line-height:1.4;border:1px solid var(--border);transition:background .15s}

/* Mini data table */
.mini-data{font-size:.74rem;margin:10px 0}

/* Decomposition diagram */

/* Section indicator */
.section-indicator{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:var(--blue);color:#fff;border-radius:20px;font-size:.78rem;font-weight:700;margin-bottom:16px}

.world-toggle .wt-badge.static{background:#065f46;color:#d1fae5}.world-toggle .wt-badge.static b{color:#fff}
.world-toggle .wt-badge.holiday{background:#92400e;color:#fde68a}.world-toggle .wt-badge.holiday b{color:#fff}
.world-toggle .wt-desc{font-size:.7rem;color:#94a3b8;margin-top:6px;line-height:1.5}
.world-toggle select{padding:6px 8px;border:1px solid rgba(255,255,255,.15);border-radius:6px;font-size:.76rem;width:100%;background:rgba(255,255,255,.08);color:#e2e8f0}
/* Sidebar glossary */
.side-glossary{margin-top:12px;font-size:.74rem}
.side-glossary summary{cursor:pointer;color:#34d399;font-weight:700;padding:4px 0;font-size:.78rem;user-select:none}
.side-glossary summary:hover{color:#6ee7b7}
/* Table legend */
.tbl-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.7rem;color:var(--muted)}
.tbl-legend span{background:#f1f5f9;padding:2px 8px;border-radius:10px;white-space:nowrap}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"></aside><main class="main" id="content"><p style="color:var(--muted);padding:40px">Loading...</p></main></div><script>

fetch("data.json?v=10").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){D=j;try{build()}catch(e){document.getElementById("content").innerHTML='<div class="card"><h3>JS Error</h3><p>'+e.message+'</p><pre>'+e.stack+'</pre></div>'}}).catch(function(e){document.getElementById("content").innerHTML='<div class="card"><h3>Cannot load data.json</h3><p>Run <code>python docs/demo/generate.py</code></p><p>'+e.message+'</p></div>'});
function fmt(v,d){d=d||4;return(v>=0?"+":"")+v.toFixed(d)}
function r(){return D[activeRegime]}
function cov(dd){return dd.ci_low<=dd.truth&&dd.truth<=dd.ci_high}
function row(k,v){return"<tr><td>"+k+"</td><td><b>"+v+"</b></td></tr>"}
function badge(v,ok){return'<span class="badge '+(ok?"bg":"br")+'">'+v+'</span>'}
function np(ns,id){for(var i=0;i<ns.length;i++)if(ns[i].id===id)return ns[i];return null}
function T(tx,tip){return'<span class="term" data-tip="'+tip+'">'+tx+'</span>'}
function M(s){try{return katex.renderToString(s,{throwOnError:false,displayMode:false})}catch(e){return"<code>"+s+"</code>"}}
function DM(s){try{return katex.renderToString(s,{throwOnError:false,displayMode:true})}catch(e){return"<code>"+s+"</code>"}}

function buildLadderSVG(ladder){
  if(!ladder)return"";
  var W=520,H=480,h='<svg viewBox="0 0 '+W+' '+H+'" style="max-width:100%;height:auto;background:#fff">';
  h+='<rect width="'+W+'" height="'+H+'" fill="#fafbfc" rx="8"/>';
  h+='<text x="260" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a2e">'+ladder.title+'</text>';
  // Draw rungs
  for(var i=0;i<ladder.rungs.length;i++){
    var r=ladder.rungs[i],rx=60,ry=r.y-22,rw=400,rh=44;
    h+='<rect x="'+rx+'" y="'+ry+'" width="'+rw+'" height="'+rh+'" rx="8" fill="'+r.color+'" opacity="0.15" stroke="'+r.color+'" stroke-width="2"/>';
    h+='<circle cx="'+(rx+22)+'" cy="'+r.y+'" r="12" fill="'+r.color+'"/><text x="'+(rx+22)+'" y="'+(r.y+4)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">'+(i+1)+'</text>';
    h+='<text x="'+(rx+44)+'" y="'+(r.y-6)+'" font-size="11" font-weight="700" fill="'+r.color+'">'+r.label+'</text>';
    h+='<text x="'+(rx+44)+'" y="'+(r.y+12)+'" font-size="9" fill="#475569">'+r.desc+'</text>';
    h+='<text x="'+(rx+300)+'" y="'+(r.y+4)+'" text-anchor="middle" font-size="11" font-family="monospace" fill="'+r.color+'">'+r.symbol+'</text>';
  }
  // Climb arrows
  for(var i=0;i<ladder.climb.length;i++){
    var c=ladder.climb[i],fromR=ladder.rungs[c.from_rung-1],toR=ladder.rungs[c.to_rung-1];
    var ax=60,ay=fromR.y+22,by=toR.y-22;
    h+='<line x1="'+ax+'" y1="'+ay+'" x2="'+ax+'" y2="'+by+'" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>';
    h+='<polygon points="'+(ax-5)+','+(by-3)+' '+ax+','+by+' '+(ax+5)+','+(by-3)+'" fill="#64748b"/>';
    h+='<text x="'+(ax+16)+'" y="'+(ay+by)/2+'" font-size="8" fill="#64748b">'+c.requires+'</text>';
  }
  // Labels on the right
  h+='<text x="475" y="142" font-size="9" fill="#64748b" font-style="italic">condition()</text>';
  h+='<text x="475" y="282" font-size="9" fill="#64748b" font-style="italic">do()</text>';
  h+='<text x="475" y="422" font-size="9" fill="#64748b" font-style="italic">abduction-action-prediction</text>';
  h+='</svg>';
  return '<div class="card">'+wrapGraph(h)+'</div>';
}

// Wrap SVG in a pannable graph panel with toolbar (MUST be defined before use)
function wrapGraph(svgHtml){
  return '<div class="graph-panel"><div class="graph-bar"><button class="gb-zoomin" title="Zoom in">+</button><button class="gb-zoomout" title="Zoom out">-</button><button class="gb-reset" title="Reset">↺</button><span class="gb-hint">Drag to pan · Scroll to zoom</span></div>'+svgHtml+'</div>';
}

function buildConfoundingBars(v){
  if(!v)return"";
  var W=500,H=140,barW=360,barX=90,barH=28,gap=12;
  var h='<svg viewBox="0 0 '+W+' '+H+'" style="max-width:100%;height:auto;background:#fff">';
  h+='<text x="250" y="20" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1a2e">'+v.title+'</text>';
  var maxVal=Math.max.apply(null,v.bars.map(function(b){return b.value}))*1.3;
  for(var i=0;i<v.bars.length;i++){
    var b=v.bars[i],y=40+i*(barH+gap),w=(b.value/maxVal)*barW;
    h+='<text x="85" y="'+(y+18)+'" text-anchor="end" font-size="10" fill="#475569">'+b.label+'</text>';
    h+='<rect x="'+barX+'" y="'+y+'" width="'+w+'" height="'+barH+'" rx="4" fill="'+b.color+'" opacity="0.8"/>';
    h+='<text x="'+(barX+w+6)+'" y="'+(y+18)+'" font-size="11" font-weight="700" fill="'+b.color+'">'+(b.value>=0?'+':'')+b.value.toFixed(3)+'</text>';
    h+='<text x="'+(barX+w+56)+'" y="'+(y+18)+'" font-size="9" fill="#94a3b8">rung '+b.rung+'</text>';
  }
  // Annotations
  h+='<text x="250" y="130" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Red bar = rung-1 association. Green = rung-2 causal truth. Orange gap = confounding bias removed by adjustment.</text>';
  h+='</svg>';
  return '<div class="card">'+wrapGraph(h)+'</div>';
}

function buildEvalueGauge(v){
  if(!v)return"";
  var W=520,H=120;
  var h='<svg viewBox="0 0 '+W+' '+H+'" style="max-width:100%;height:auto;background:#fff">';
  h+='<text x="260" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#1a1a2e">'+v.title+'</text>';
  var gx=40,gw=440,gy=50,gh=30;
  var total=v.zones[v.zones.length-1].max-v.zones[0].min;
  for(var i=0;i<v.zones.length;i++){
    var z=v.zones[i],zx=gx+(z.min-v.zones[0].min)/total*gw,zw=(z.max-z.min)/total*gw;
    h+='<rect x="'+zx+'" y="'+gy+'" width="'+zw+'" height="'+gh+'" rx="3" fill="'+z.color+'" opacity="0.3" stroke="'+z.color+'" stroke-width="1"/>';
    h+='<text x="'+(zx+zw/2)+'" y="'+(gy+gh+16)+'" text-anchor="middle" font-size="8" fill="'+z.color+'">'+z.label+'</text>';
  }
  // Marker
  var mx=gx+(v.our_value-v.zones[0].min)/total*gw;
  h+='<polygon points="'+(mx-6)+','+(gy-4)+' '+mx+','+(gy+8)+' '+(mx+6)+','+(gy-4)+'" fill="#1a1a2e"/>';
  h+='<line x1="'+mx+'" y1="'+(gy+8)+'" x2="'+mx+'" y2="'+(gy+gh+4)+'" stroke="#1a1a2e" stroke-width="1.5"/>';
  h+='<text x="'+mx+'" y="'+(gy-8)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">'+v.our_value.toFixed(2)+'</text>';

function applyTooltips(text,tooltips){
  if(!tooltips)return text;
  var result=text;
  var keys=Object.keys(tooltips).sort(function(a,b){return b.length-a.length});
  for(var i=0;i<keys.length;i++){
    var k=keys[i],escaped=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    // Use \b word boundaries for simple word terms to avoid matching inside other words
    var isSimpleWord=/^[A-Za-z0-9 ]+$/.test(k);
    if(isSimpleWord){
      var re=new RegExp('\\b('+escaped+')\\b','g');
      result=result.replace(re,function(match){
        return '<span class="term" data-tip="'+tooltips[k].replace(/"/g,'&quot;')+'">'+match+'</span>';
      });
    }else{
      // For terms with special chars (do(T), Y(1), rung 1, etc.), use original regex
      var re=new RegExp('(^|[^>\\w])('+escaped+')([^<\\w]|$)','g');
      result=result.replace(re,function(m,before,match,after){
        return before+'<span class="term" data-tip="'+tooltips[k].replace(/"/g,'&quot;')+'">'+match+'</span>'+after;
      });
    }
  }
  return result;
}

function buildThinking(th){
  if(!th)return"";
  var h='';
  // LAYER 1: Key Points
  h+='<details class="think" open><summary>Layer 1: Key Points</summary><div class="think-body">';
  if(th.takeaway)h+='<div class="callout cg" style="margin-bottom:10px"><b>Takeaway:</b> '+th.takeaway+'</div>';
  if(th.symbolic)h+='<div class="formula" style="display:block;padding:10px 14px;font-size:.88em;line-height:1.9">'+DM(th.symbolic)+'</div>';
  h+='</div></details>';
  // LAYER 2: Reasoning Chain
  if(th.steps&&th.steps.length>0){
    h+='<details class="think"><summary>Layer 2: Reasoning Chain</summary><div class="think-body">';
    for(var i=0;i<th.steps.length;i++){
      var s=th.steps[i];
      h+='<div class="reason-step"><div class="rs-num">'+(i+1)+'</div><div><span class="rs-label">'+s.label+'</span><br>'+s.detail+'</div></div>';
    }
    h+='</div></details>';
  }
  // LAYER 3: Concrete Operations
  var hasHow = (th.derivation&&th.derivation.body);
  if(hasHow){
    var derBody=th.derivation.body;
    // If body has no HTML tags, render as display LaTeX
    if(!/<[a-z][\s\S]*>/i.test(derBody)){
      derBody=DM(derBody);
    }
    h+='<details class="think"><summary>Layer 3: Concrete Operations</summary><div class="think-body">';
    h+='<details class="think-derivation" open><summary>'+(th.derivation.title||"Derivation")+'</summary><div class="der-body">'+derBody+'</div></details>';
    h+='</div></details>';
  }
  // LAYER 4: Logic Verification
  if(th.logic&&th.logic.length>0){
    h+='<details class="think"><summary>Layer 4: Logic Verification</summary><div class="think-body">';
    for(var i=0;i<th.logic.length;i++){
      var lc=th.logic[i],cls=lc.holds?"logic-row":"logic-row lr-false";
      h+='<div class="'+cls+'"><span class="lr-symbol">'+(lc.holds?'✓':'✗')+'</span><div><span class="lr-if">IF</span> '+lc["if"]+' <span class="lr-then">THEN</span> '+lc.then;
      if(lc.note)h+=' <span style="font-size:.76rem;color:var(--muted)">('+lc.note+')</span>';
      h+='</div></div>';
    }
    h+='</div></details>';
  }
  // LAYER 5: Pitfalls & References
  var hasPitfalls = (th.pitfalls&&th.pitfalls.length>0);
  if(hasPitfalls||th.refs){
    h+='<details class="think"><summary>Layer 5: Pitfalls & References</summary><div class="think-body">';
    if(th.pitfalls&&th.pitfalls.length>0){
      h+='<h4>Common Pitfalls</h4>';
      for(var i=0;i<th.pitfalls.length;i++){
        var pf=th.pitfalls[i];
        h+='<div class="pitfall"><div class="pf-mistake">'+(i+1)+'. '+pf.mistake+'</div><div class="pf-consequence">→ '+pf.consequence+'</div><div class="pf-why">'+pf.why+'</div></div>';
      }
    }
    if(th.refs)h+='<div class="think-refs">References: '+th.refs+'</div>';
    h+='</div></details>';
  }
  return h;
}

    // "The Story This Graph Tells" -- foldable narrative
    h+='<div class="card"><h3>The Story This Graph Tells</h3>';
    h+='<p>A user\'s true hunger (U) is invisible to the platform. Hungry users use the app more (U→W), so the targeting algorithm — which only sees W — sends them more notifications (W→T). Hungry users also order more regardless of notifications (U→Y). This creates a <b>back-door path</b> T←W←U→Y: association flows backwards from T to U through W, then forwards from U to Y — producing a spurious correlation between notifications and orders that has nothing to do with causation.</p>';
    h+='<details class="think"><summary>🔍 How back-door adjustment works + each variable\'s role (click to expand)</summary><div class="think-body">';
    h+='<p><b>To close this back door, we condition on W.</b> Because W is the only channel through which U affects T, conditioning on W blocks the entire confounding path. This is why W is the single most important variable — without it, the ATE is not identified.</p>';
    h+='<p>The other variables each play a specific role in the causal structure:</p>';
    h+='<ul style="margin-left:20px;font-size:.9rem"><li><b>M (app open):</b> The mediator — part of <i>how</i> notifications work (T→M→Y). We want the total effect, so we <b>must not</b> adjust for M — doing so would block the mediated path and bias the estimate downward.</li>';
    h+='<li><b>S (engagement):</b> A collider — computed from both T and Y (T→S←Y). Conditioning on "high engagement" selects users who either got notified OR ordered, creating a spurious negative association (Berkson\'s bias). <b>Never condition on a collider.</b></li>';

    h+='</div></details></div>';
    // "How Did We Build This Graph?" -- foldable, honest about actual vs hypothetical

    h+='<p>Building a causal graph requires <b>domain knowledge</b>, not just data. Below is the concrete process for the NomNom DAG — which methods were <b>actually used</b> and which are <b>emerging alternatives</b>.</p>';
    h+='<details class="think"><summary>📐 How this DAG was built (click to expand)</summary><div class="think-body">';
    h+='<div class="callout cg" style="margin-bottom:10px"><b>✓ Actually used for the NomNom DAG:</b></div>';
    h+='<p><b>1. Expert elicitation</b> — domain experts drew arrows from system knowledge:</p>';
    h+='<ul style="margin-left:20px;font-size:.87rem;line-height:1.9"><li>PM: targeting algorithm uses W → <b>W → T</b></li><li>Engineer: send-time jitter is randomized → <b>Z → T</b></li><li>Engineer: engagement score = f(notifications, orders) → <b>T → S ← Y</b> (collider)</li><li>Data scientist: hunger unmeasured but correlates with app-use → <b>U → W</b> (proxy); hunger → orders → <b>U → Y</b>; hunger → app-opens → <b>U → M</b></li><li>Data scientist: weather/calendar affect both targeting and ordering → <b>rain, weekend, payday → T, Y</b></li><li>Data scientist: battery drain correlates with app-use, not notifications → <b>U → NC</b>; <b>T ↛ NC</b> (absent edge)</li></ul>';
    h+='<p><b>2. Literature & prior evidence</b> — published results confirmed or constrained edges:</p>';

    h+='<div class="callout cw" style="margin-top:12px"><b>Honest assessment:</b> This DAG was built through <b>expert elicitation + literature + PC/FCI validation</b>. LLM methods and agentic loops are promising but were not used here — they remain research-stage tools that require careful validation. <a href="deep_dag_building.html"><b>See the deep dive</b></a> for a critical philosophical and epistemological analysis of causal graph methodology.</div>';

    // Critical analysis of the NomNom DAG

    h+='<details class="think"><summary>⚠️ Limitations, assumptions, and what we cannot know (click to expand)</summary><div class="think-body">';
    h+='<p><b>1. The untestable assumption.</b> The entire identification rests on <b>no unmeasured confounding</b>: we assume U affects T <i>only</i> through W. If hunger affects notifications through any channel besides app-use history (e.g., the platform uses ML features that inadvertently capture hunger signals beyond W), the back-door path is not fully blocked and the ATE is biased. <b>This assumption is untestable from observational data.</b> The E-value (~2.73) quantifies how strong such a hidden confounder would need to be — but cannot tell us whether one exists.</p>';

    h+='<p><b>7. External validity is unknown.</b> This graph was built for a synthetic DGP with known structure. In a real platform, the graph would need to be validated against: (a) domain experts who know the actual system, (b) historical A/B test results that can confirm or refute specific edges, (c) stability across time periods and user segments. A graph that works in simulation may fail in reality.</p>';
    h+='<div class="callout cr" style="margin-top:12px"><b>Bottom line:</b> This graph is <b>pedagogically sound but practically simplified</b>. It correctly illustrates confounding, mediation, colliders, instruments, and negative controls — the core concepts of causal graph methodology. But it should not be mistaken for a production-ready causal model of a real food-delivery platform. Every assumption listed above is a <b>target for empirical testing</b> in a real deployment. <a href="deep_dag_building.html"><b>See the deep dive</b></a> for a broader philosophical and epistemological analysis of causal graph methodology.</div>';
    h+='</div></details></div>';

  h+='<div class="callout"><b>Key insight:</b> W is the most important node. The platform targets on W (proxy for U). Conditioning on W blocks the back-door path, making the ATE identifiable. <b>Without W, the ATE is not identified.</b></div>';

  h+='<details class="think"><summary>🔬 How the DGP works — equations, code & reproducibility (click to expand)</summary><div class="think-body">';
  h+='<p>The DGP is a set of <b>structural equations</b>, one per node. Each exogenous variable is drawn independently, then endogenous variables are computed from their causal parents:</p>';
  h+='<p><b>Step 1 — Draw exogenous noise (nature\'s coin flips):</b></p>';
  h+='<ul style="margin-left:20px;font-size:.85rem;line-height:1.8"><li><code>segment ~ Bernoulli(0.6)</code> — 1 = loyal user (60%), 0 = new user (40%)</li><li><code>U ~ N(0,1)</code> — latent hunger (the platform CANNOT see this)</li><li><code>ε_W ~ N(0, 0.5)</code> — measurement noise around true hunger</li><li><code>Z ~ Bernoulli(0.5)</code> — randomized send-time jitter (instrument)</li><li><code>rain ~ Bernoulli(0.30)</code> · <code>weekend ~ Bernoulli(0.28)</code> · <code>payday ~ Bernoulli(0.14)</code></li><li><code>L ~ N(480, 60)</code> — loyalty points for RDD coupon assignment</li></ul>';

  if(s.id==="assume"){var ne=ds.n_edges||0,no=ds.n_observed||0,na=ds.n_absent_edges||0;h+='<table>'+row("Graph","<code>'+rd.graph_version+'</code>")+row("Observed / Edges",no+" / "+ne)+row("Absent edges",String(na))+'</table>';}

  if(s.id==="feature"){var ex=[];if(ds.node_roles){for(var k in ds.node_roles){var rl=ds.node_roles[k];if(rl==="mediator"||rl==="collider")ex.push(k+" ("+rl+")");}}h+='<table>'+row("Adjustment","<code>"+(rd.adjustment_set||[]).join(", ")+"</code>")+row("Excluded",ex.join(", "))+'</table>';}
  if(s.id==="model"){h+='<div class="step-box"><b>How:</b> Cross-fit AIPW. Neyman-orthogonal score. Doubly robust.</div><div class="metrics"><div class="metric hl"><div class="val">'+fmt(rd.ate)+'</div><div class="lbl">ATE</div></div><div class="metric"><div class="val">['+fmt(rd.ci_low)+','+fmt(rd.ci_high)+']</div><div class="lbl">95% CI</div></div><div class="metric"><div class="val">'+fmt(rd.truth)+'</div><div class="lbl">Truth</div></div><div class="metric"><div class="val">'+(cov(rd)?"PASS":"FAIL")+'</div><div class="lbl">CI Covers</div></div></div>';}
  if(s.id==="evaluate")h+='<div class="metrics"><div class="metric"><div class="val">'+rd.e_value.toFixed(2)+'</div><div class="lbl">E-value</div></div><div class="metric"><div class="val">'+rd.risk_ratio.toFixed(2)+'</div><div class="lbl">Risk Ratio</div></div><div class="metric"><div class="val">'+rd.max_smd.toFixed(4)+'</div><div class="lbl">|SMD|</div></div></div>';
  if(s.id==="test"){h+='<table><tr><th>Refuter</th><th>Result</th></tr><tr><td>Placebo treatment</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Random common cause</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Subset refuter</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr><tr><td>Negative control (NC)</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td></tr></table><p>'+badge("ALL GREEN: "+rd.all_green,rd.all_green)+'</p>';}
  // Thinking process block
  if(s.thinking)h+=buildThinking(s.thinking);
  h+="</div>";return h;
}

// Generic pan + zoom for any graph panel
// Shift+drag on any text label moves just that label
function setupGraphPanels(){
  var panels=document.querySelectorAll(".graph-panel");
  for(var i=0;i<panels.length;i++){(function(panel){
    var svg=panel.querySelector("svg");if(!svg)return;
    var tx=0,ty=0,scale=1,panning=false,px=0,py=0;
    var draggingLabel=null,dlx=0,dly=0;
    function apply(){svg.style.transform="translate("+tx+"px,"+ty+"px) scale("+scale+")"}
    // Make all text labels show tooltip about Shift+drag
    var texts=svg.querySelectorAll("text");
    for(var ti=0;ti<texts.length;ti++){
      var t=texts[ti];
      if(!t.textContent||t.textContent.length<2)continue;
      if(!t.querySelector("title")){
        var tt=document.createElementNS("http://www.w3.org/2000/svg","title");
        tt.textContent="Shift+drag to reposition this label";
        t.appendChild(tt);
      }
    }
    panel.addEventListener("mousedown",function(e){
      if(e.shiftKey&&e.target&&e.target.nodeName==="text"){
        // Shift+drag: move individual label
        draggingLabel=e.target;dlx=e.clientX;dly=e.clientY;
        e.preventDefault();e.stopPropagation();return;
      }
      panning=true;px=e.clientX;py=e.clientY;e.preventDefault();
    });
    window.addEventListener("mousemove",function(e){
      if(draggingLabel){
        var dx=e.clientX-dlx,dy=e.clientY-dly,cur=parseFloat(draggingLabel.getAttribute("x")||0);
        if(draggingLabel.getAttribute("text-anchor")==="middle"){
          // For center-anchored text, adjust x and y
          var cx=parseFloat(draggingLabel.getAttribute("x")||0)+dx;
          var cy=parseFloat(draggingLabel.getAttribute("y")||0)+dy;
          draggingLabel.setAttribute("x",cx);draggingLabel.setAttribute("y",cy);
        }else{
          draggingLabel.setAttribute("x",(parseFloat(draggingLabel.getAttribute("x")||0)+dx));
          draggingLabel.setAttribute("y",(parseFloat(draggingLabel.getAttribute("y")||0)+dy));
        }
        dlx=e.clientX;dly=e.clientY;return;
      }
      if(!panning)return;
      tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply();
    });
    window.addEventListener("mouseup",function(){panning=false;draggingLabel=null});
    panel.addEventListener("wheel",function(e){e.preventDefault();var z=scale*(e.deltaY<0?1.15:1/1.15);scale=Math.max(0.3,Math.min(4,z));apply()});
    // Touch
    panel.addEventListener("touchstart",function(e){if(e.touches.length===1){panning=true;px=e.touches[0].clientX;py=e.touches[0].clientY}});
    window.addEventListener("touchmove",function(e){if(!panning||draggingLabel)return;tx+=e.touches[0].clientX-px;ty+=e.touches[0].clientY-py;px=e.touches[0].clientX;py=e.touches[0].clientY;apply()});
    window.addEventListener("touchend",function(){panning=false});
    // Toolbar buttons
    var bar=panel.querySelector(".graph-bar");
    if(bar){
      bar.querySelector(".gb-zoomin").addEventListener("click",function(e){e.stopPropagation();scale=Math.min(4,scale*1.2);apply()});
      bar.querySelector(".gb-zoomout").addEventListener("click",function(e){e.stopPropagation();scale=Math.max(0.3,scale/1.2);apply()});
      bar.querySelector(".gb-reset").addEventListener("click",function(e){e.stopPropagation();tx=0;ty=0;scale=1;apply()});
    }
  })(panels[i])}
}
function dagPopup(ev,nodeId){
  var p=document.getElementById("dagpopup");if(!p)return;var nd=null;
  if(D&&D.content&&D.content.dag)for(var i=0;i<D.content.dag.nodes.length;i++)if(D.content.dag.nodes[i].id===nodeId)nd=D.content.dag.nodes[i];
  if(!nd||!nd.detail)return;
  p.innerHTML='<div style="text-align:right;margin-bottom:4px"><span style="cursor:pointer;color:#94a3b8;font-size:1.1rem" onclick="document.getElementById(\'dagpopup\').classList.remove(\'on\')">&times;</span></div>'+nd.detail;
  p.classList.add("on");p.style.left=Math.min(ev.clientX+10,window.innerWidth-420)+"px";p.style.top=Math.min(ev.clientY+10,window.innerHeight-300)+"px";
}
document.addEventListener("click",function(e){var p=document.getElementById("dagpopup");if(p&&!e.target.closest(".dagn")&&!e.target.closest(".dagpop"))p.classList.remove("on")});
</script>
