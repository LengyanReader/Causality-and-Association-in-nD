<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Causal Science — A Guided Walkthrough</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#2c3e50;--muted:#6c757d;--blue:#3498db;--green:#2ecc71;--orange:#f39c12;--red:#e74c3c;--purple:#9b59b6;--teal:#1abc9c;--dark:#34495e;--border:#dee2e6;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:#2c3e50;color:#ecf0f1;padding:20px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10}
.sidebar h2{font-size:1.1rem;margin-bottom:2px}
.sidebar .sub{font-size:.78rem;color:#95a5a6;margin-bottom:12px}
.sidebar h3{font-size:.85rem;margin:14px 0 6px;color:var(--green)}
.gt{font-size:.78rem;margin-bottom:4px;padding:2px 0}.gt b{color:var(--green)}
.regime-badge{display:block;text-align:center;background:var(--blue);color:white;padding:8px;border-radius:6px;margin-bottom:12px;font-weight:700;font-size:.85rem}
.main{margin-left:280px;padding:32px 40px;max-width:900px;flex:1}
h1{font-size:1.9rem;font-weight:800;margin-bottom:4px}
h2{font-size:1.35rem;margin:36px 0 16px;padding-bottom:6px;border-bottom:3px solid var(--blue);display:inline-block}
h3{font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;text-align:center;min-width:120px;box-shadow:0 2px 4px rgba(0,0,0,.04)}
.metric .val{font-size:1.5rem;font-weight:800;color:var(--blue)}.metric .lbl{font-size:.76rem;color:var(--muted);margin-top:3px}
.metric.diff .val{color:#e74c3c}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:12px 0}
th{background:var(--dark);color:white;padding:8px 12px;text-align:left}td{padding:8px 12px;border-bottom:1px solid var(--border)}tr:hover td{background:#f1f5f9}
.box{background:#eaf2f8;border-left:4px solid var(--blue);padding:14px 18px;margin:14px 0;border-radius:0 var(--radius) var(--radius) 0;font-size:.9rem}
.box-warn{background:#fef9e7;border-left-color:var(--orange)}
.box-good{background:#eafaf1;border-left-color:var(--green)}
.box-important{background:#fdedec;border-left-color:var(--red)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:700}.bg{background:#d5f5e3;color:#1e8449}.br{background:#fadbd8;color:#c0392b}
select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:.84rem;width:100%;margin-bottom:12px}
.nav-progress{position:sticky;top:0;background:var(--bg);padding:12px 0;margin-bottom:20px;z-index:5;border-bottom:1px solid var(--border)}
.nav-progress .step{display:inline-block;padding:4px 10px;margin:2px 3px;font-size:.75rem;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--muted);text-decoration:none}
.nav-progress .step:hover{background:var(--blue);color:white}
.formula{background:#f1f3f4;padding:8px 14px;border-radius:4px;display:inline-block;margin:4px 0}
.term{color:var(--blue);font-weight:600;border-bottom:1px dotted var(--blue);cursor:help;position:relative}
.term:hover::after{content:attr(data-tip);position:absolute;bottom:24px;left:0;background:#2c3e50;color:white;padding:6px 10px;border-radius:4px;font-size:.78rem;font-weight:400;white-space:nowrap;z-index:100;pointer-events:none}
svg text{font-family:system-ui,sans-serif}
</style></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main" id="content"><p style="color:var(--muted);padding:40px">Loading...</p></main>
</div>
<script>
var D=null,activeRegime="static";
fetch("data.json?v=5").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){D=j;try{build()}catch(e){document.getElementById("content").innerHTML='<div class="card"><h3>Error</h3><p>'+e.message+'</p></div>'}}).catch(function(e){document.getElementById("content").innerHTML='<div class="card"><h3>Cannot load data</h3><p>Run <code>python docs/demo/generate.py</code>.</p><p>'+e.message+'</p></div>'});

function fmt(v,d){d=d||4;return(v>=0?"+":"")+v.toFixed(d)}
function r(){return D[activeRegime]}
function cov(re){return re.ci_low<=re.truth&&re.truth<=re.ci_high}
function row(k,v,c){c=c||"";return"<tr><td>"+k+"</td><td"+(c?' class="'+c+'"':"")+"><b>"+v+"</b></td></tr>"}
function badge(v,ok){return'<span class="badge '+(ok?"bg":"br")+'">'+v+'</span>'}
function nodePos(ns,id){for(var i=0;i<ns.length;i++)if(ns[i].id===id)return ns[i];return null}
function T(abbr,tip){return'<span class="term" data-tip="'+tip+'">'+abbr+'</span>'}
function TeX(s){try{return katex.renderToString(s,{throwOnError:false})}catch(e){return'<code>'+s+'</code>'}}

function build(){
  if(!D)return;
  var rd=r(),cs=D.content.stations,c=D.content,rs=activeRegime==="holiday"?D.holiday:D.static,h="";
  buildSidebar();

  h+='<h1>'+c.title+'</h1><p style="font-size:1.1rem;color:var(--muted)">'+c.subtitle+'</p>';
  h+='<div class="nav-progress"><span class="step" style="background:var(--green);color:white;font-weight:700">Regime: '+activeRegime.toUpperCase()+'</span> ';
  h+='<a href="#s1" class="step">1. Problem</a> <a href="#s2" class="step">2. Graph</a> <a href="#s3" class="step">3. Workflow</a> <a href="#s4" class="step">4. Sensitivity</a> <a href="#s5" class="step">5. Evolution</a> <a href="#s6" class="step">6. Counterfactuals</a> <a href="#s7" class="step">7. Summary</a></div>';

  // ── PART 1: THE PROBLEM ──
  h+='<h2 id="s1">1. The Problem: '+T('Association ≠ Causation','Pearl: The three rungs of the ladder of causation are strictly distinct. No amount of rung-1 (associational) data alone answers rung-2 (interventional) questions without causal assumptions.')+'</h2>';
  h+='<div class="card"><p style="font-size:1.05rem"><i>'+c.background.use_case+'</i></p><p>'+c.background.problem+'</p></div>';

  if(c.problem_formulation){var pf=c.problem_formulation;
    h+='<div class="box box-warn"><b>Why this is causal:</b><br>'+pf.why_causal+'</div>';
    h+='<div class="card"><h3>The Target Trial (what we would randomize if we could)</h3><p>'+pf.target_trial+'</p>';
    h+='<p><b>'+T('Estimand','The precise quantity we want to estimate. For causal questions, this must be expressed in terms of potential outcomes Y(1), Y(0).')+':</b> <span class="formula">'+TeX("\\text{ATE} = E[Y(1) - Y(0)]")+'</span></p>';
    h+='<p><b>Key Assumptions:</b></p><ol>';
    h+='<li>'+T('Ignorability','No unmeasured confounding: {Y(0),Y(1)} ⟂ T | X. The observed covariates X block all back-door paths.')+': {Y(0),Y(1)} ⊥ T | {W,rain,weekend,payday}</li>';
    h+='<li>'+T('Positivity','Every unit must have a non-zero probability of receiving either treatment: 0 < P(T=1|X=x) < 1 for all x.')+': 0 < P(T=1|X) < 1 for all X</li>';
    h+='<li>'+T('SUTVA','Stable Unit Treatment Value Assumption: (1) no interference between units, (2) only one version of each treatment level.')+': no interference, one treatment version</li>';
    h+='<li>'+T('Consistency','The observed outcome under T=t equals the potential outcome Y(t). This links the counterfactual world to the observed world.')+': Y_obs = T·Y(1) + (1-T)·Y(0)</li>';
    h+='</ol></div>';
    h+='<p>The ladder we climb: '+T('Rung 1','Association: P(Y|T) — seeing')+' → '+T('Rung 2','Intervention: P(Y|do(T)) — doing')+' → '+T('Rung 3','Counterfactuals: P(Y(0)=0|T=1,Y=1) — imagining')+'</p>';
  }

  // ── PART 2: THE CAUSAL GRAPH ──
  h+='<h2 id="s2">2. The '+T('Causal Graph','A Directed Acyclic Graph (DAG) where nodes are variables and arrows represent direct causal relationships. Each arrow is an assumption; each absent arrow is a falsifiable claim.')+': Making Assumptions Visible</h2>';
  if(c.dag){
    h+='<div class="card"><p>'+c.dag.description+'</p>';
    h+='<svg viewBox="0 0 720 240" style="max-width:100%;height:auto;background:white;border-radius:6px">';
    for(var j=0;j<c.dag.edges.length;j++){var e=c.dag.edges[j],fn=nodePos(c.dag.nodes,e.from),tn=nodePos(c.dag.nodes,e.to);
      if(fn&&tn){var dash=e.style==="dashed"?"8,3":(e.style==="dotted"?"3,3":"none");
      h+='<line x1="'+fn.x+'" y1="'+fn.y+'" x2="'+tn.x+'" y2="'+tn.y+'" stroke="'+e.color+'" stroke-width="'+(e.label==="causal target"?3:1.5)+'" stroke-dasharray="'+dash+'" opacity="0.75"/>';
      if(e.label==="causal target")h+='<polygon points="'+tn.x+','+tn.y+' '+(tn.x-8)+','+(tn.y-4)+' '+(tn.x-8)+','+(tn.y+4)+'" fill="'+e.color+'"/>';}}
    for(var j=0;j<c.dag.nodes.length;j++){var n=c.dag.nodes[j];
      h+='<circle cx="'+n.x+'" cy="'+n.y+'" r="16" fill="'+n.color+'" stroke="#2c3e50" stroke-width="1.5"/>';
      h+='<text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" font-size="8" font-weight="bold" fill="'+(n.color==="#e8e8e8"?"#555":"white")+'">'+n.id+'</text>';
      h+='<text x="'+n.x+'" y="'+(n.y-20)+'" text-anchor="middle" font-size="7" fill="#2c3e50">'+n.label+'</text>';}
    h+='<g transform="translate(10,210)">';
    for(var j=0;j<c.dag.legend.length;j++){var l=c.dag.legend[j],dx=j*155;
      h+='<line x1="'+dx+'" y1="8" x2="'+(dx+30)+'" y2="8" stroke="'+l.color+'" stroke-width="2" stroke-dasharray="'+(l.style==="dashed"?"6,2":(l.style==="dotted"?"3,3":"none"))+'"/>';
      h+='<text x="'+(dx+34)+'" y="12" font-size="7" fill="#2c3e50">'+l.label+'</text>';}
    h+='</g></svg></div>';}
  h+='<div class="box"><b>Key insight:</b> W (app-use history) is the most important node. The platform targets on W, a proxy for true hunger U. Conditioning on W '+T('blocks the confounding path','The back-door path U→W→T ... U→Y is open in the original DAG. By conditioning on W, we d-separate T from Y along this path, making the ATE identified.')+' U→W→T ... U→Y, making the ATE '+T('identifiable','An estimand is identified if it can be expressed solely in terms of observable quantities — i.e., there exists a formula mapping observed data to the causal quantity.')+'.</div>';

  // ── PART 3: WORKFLOW ──
  h+='<h2 id="s3">3. The Workflow: From Question to Answer</h2>';
  h+='<p>With the graph in hand, we walk the 9-station '+T('Universal Causal Loop (UCL)','A closed-loop control system for causal inference: each station has sensors (health metrics) and actuators (revision actions). The EVOLVE station feeds back to ASSUME, making the workflow self-correcting.')+'.</p>';
  h+='<div class="card"><h3>Ground Truth (computed by Monte Carlo under intervention)</h3><p>'+c.background.premise+'</p>';
  h+='<div class="metrics">';
  var dstatic=D.static,dhol=D.holiday;
  h+='<div class="metric'+(activeRegime!=="static"?' diff':'')+'"><div class="val">'+fmt(dstatic.truth)+'</div><div class="lbl">Static ATE</div></div>';
  h+='<div class="metric'+(activeRegime!=="holiday"?' diff':'')+'"><div class="val">'+fmt(dhol.truth)+'</div><div class="lbl">Holiday ATE</div></div>';
  h+='<div class="metric"><div class="val">'+fmt(dstatic.cate_loyal)+'</div><div class="lbl">CATE (loyal)</div></div>';
  h+='<div class="metric"><div class="val">'+fmt(dstatic.cate_new)+'</div><div class="lbl">CATE (new)</div></div></div>';
  h+='<p style="font-size:.82rem;color:var(--muted)">Holiday changes T→M from 1.6 to 0.4. The <b style="color:var(--red)">red</b> metric above is the regime NOT currently active.</p></div>';

  for(var i=0;i<cs.length;i++)h+=stationCard(cs[i],rd);

  // ── PART 4: SENSITIVITY ──
  h+='<h2 id="s4">4. Sensitivity: '+T('How Wrong Could We Be?','An estimate without a sensitivity analysis is an open-loop claim. The E-value quantifies the minimum strength an unmeasured confounder would need to explain away the observed effect.')+'</h2>';
  if(c.evalue_deep_dive){var ev=c.evalue_deep_dive;
    h+='<div class="card"><h3>The '+T('E-value','E-value (VanderWeele & Ding, 2017, Annals of Internal Medicine): quantifies robustness to unmeasured confounding. Larger = more robust.')+'</h3>';
    h+='<div class="box box-important">'+ev.definition+'</div>';
    h+='<p><span class="formula">'+TeX("\\text{E-value} = RR_{\\text{obs}} + \\sqrt{RR_{\\text{obs}}(RR_{\\text{obs}} - 1)}")+'</span></p><p>'+ev.intuition+'</p>';
    h+='<p>Our estimate: '+T('E-value','E-value > 2 means an unmeasured confounder would need RR >= 2 with both T and Y — moderately robust.')+' = <b>'+rd.e_value.toFixed(2)+'</b> (risk ratio = '+rd.risk_ratio.toFixed(2)+')</p>';
    h+='<table><tr><th>E-value Range</th><th>Interpretation</th></tr>';
    for(var j=0;j<ev.thresholds.length;j++){var t=ev.thresholds[j].split(": ");h+='<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td></tr>'}
    h+='</table><p style="font-size:.84rem;color:var(--muted)">'+ev.ci_bound_note+'</p>';
    h+='<div class="box">'+ev.example+'</div></div>';}

  // ── PART 5: EVOLUTION ──
  h+='<h2 id="s5">5. Evolution: The Loop Closes</h2>';
  h+='<div class="card"><p>The 8th station makes the UCL a <b>loop</b> rather than a pipeline. Using the '+T('invariance principle','Peters, Buhlmann & Meinshausen (2016): a correctly specified causal mechanism has a stable conditional distribution P(effect|causes) across environments. If it degrades on new data, the DAG or mechanism has changed.')+', we detect when the world drifts.</p>';
  if(D.evolve){var dr=D.evolve.drift,al=D.evolve.alarm,keys=Object.keys(dr).sort(function(a,b){return dr[b]-dr[a]});
    h+='<table><tr><th>Node</th><th>Log-loss '+T('Degradation','The increase in negative log-likelihood when evaluating P(node|parents) on new data vs. training data. Larger = the mechanism fits less well — a sign of drift.')+'</th><th>Status (alarm='+al+')</th></tr>';
    for(var j=0;j<keys.length;j++){var kn=keys[j],kv=dr[kn];h+='<tr><td><b>'+kn+'</b></td><td>'+fmt(kv)+'</td><td>'+(kv>al?badge("DRIFT",false):badge("OK",true))+'</td></tr>'}
    h+='</table><p><b>Drift localized to: <code>'+D.evolve.worst+'</code></b> — the notification→app-open mechanism (coefficient 1.6→0.4).</p>';}
  if(D.actuator&&c.actuator_section){
    h+='<div class="box box-good"><b>'+c.actuator_section.title+':</b> '+c.actuator_section.explanation+'</div>';
    h+='<table>'+row("Holiday ATE (re-estimated)",fmt(D.actuator.ate))+row("Holiday Truth",fmt(D.actuator.truth))+row("CI Covers Truth",badge(String(D.actuator.covers),D.actuator.covers))+row("All Refuters Green",badge(String(D.actuator.all_green),D.actuator.all_green))+'</table>';}
  h+='</div>';

  // ── PART 6: COUNTERFACTUALS ──
  h+='<h2 id="s6">6. Counterfactuals: Beyond Averages</h2>';
  if(c.rung3_section){
    h+='<div class="card"><div class="box box-important"><b>Rung 3 vs Rung 2:</b> '+c.rung3_section.explanation+'</div>';
    if(D.rung3){
      h+='<table>'+row("P(Y(0)=0 | T=1, Y=1)",fmt(D.rung3.p_necessity)+" (Rung 3)")+row("ATE (same draws)",fmt(D.rung3.ate_sim)+" (Rung 2)")+row("Ground truth ATE",fmt(D.static.truth))+'</table>';
      h+='<p>~'+(D.rung3.p_necessity*100).toFixed(0)+'% of treated-and-ordered users would NOT have ordered without the notification. The ATE (~'+(D.rung3.ate_sim*100).toFixed(0)+'%) is the average over ALL users.</p>';}
    h+='<p>The three-step '+T('abduction-action-prediction','Pearl 2009, Ch.7: (1) Abduction: infer the unit\'s exogenous noise from observed data. (2) Action: modify the SCM by do(T=1-T_factual). (3) Prediction: re-run the modified SCM with the SAME inferred noise.')+' recipe:</p>';
    h+='<table><tr><th>Step</th><th>What it does</th></tr><tr><td><b>1. Abduction</b></td><td>Infer each unit\'s exogenous noise (U) from observed data — "what must the noise have been to produce what we saw?"</td></tr><tr><td><b>2. Action</b></td><td>Apply '+TeX("do(T=1-T_{\\text{factual}})")+' — "what if we flipped the treatment?"</td></tr><tr><td><b>3. Prediction</b></td><td>Re-run structural equations with SAME noise, DIFFERENT T — "what would have happened to THIS unit?"</td></tr></table></div>';}

  // ── PART 7: SUMMARY ──
  h+='<h2 id="s7">7. Summary: The Complete Workflow</h2>';
  h+='<div class="card"><table><tr><th>Stage</th><th>What We Did</th><th>Result for '+activeRegime+' regime</th></tr>';
  h+='<tr><td><b>1. Frame</b></td><td>Define estimand</td><td>ATE = E[Y(1)-Y(0)] at rung 2</td></tr>';
  h+='<tr><td><b>2. Graph</b></td><td>Encode assumptions in DAG</td><td>v'+rd.graph_version+', '+(rd.adjustment_set||[]).length+'-variable adj.</td></tr>';
  h+='<tr><td><b>3. Identify</b></td><td>Back-door via graph surgery</td><td>'+rd.criterion+': '+(rd.adjustment_set||[]).join(", ")+'</td></tr>';
  h+='<tr><td><b>4. Data</b></td><td>Check positivity, measure gap</td><td>Positivity OK, rung-1 gap = '+fmt(rd.gap||0)+'</td></tr>';
  h+='<tr><td><b>5. Estimate</b></td><td>AIPW/DML cross-fit</td><td>'+fmt(rd.ate)+' ['+fmt(rd.ci_low)+','+fmt(rd.ci_high)+'] vs '+fmt(rd.truth)+'</td></tr>';
  h+='<tr><td><b>6. Evaluate</b></td><td>E-value sensitivity</td><td>E-value = '+rd.e_value.toFixed(2)+' (moderately robust)</td></tr>';
  h+='<tr><td><b>7. Test</b></td><td>4 refuters + invariants</td><td>'+(rd.all_green?"ALL GREEN":"FAILED")+'</td></tr>';
  h+='<tr><td><b>8. Evolve</b></td><td>Mechanism-stability + actuator</td><td>Drift: M; holiday truth recovered</td></tr>';
  h+='<tr><td><b>Counterfactual</b></td><td>Abduction-action-prediction</td><td>~'+(D.rung3?(D.rung3.p_necessity*100).toFixed(0):"37")+'% necessity</td></tr></table>';
  h+='<div class="box box-good"><b>Every claim verified against known ground truth. The loop is closed — and stays closed.</b></div></div>';

  document.getElementById("content").innerHTML=h;
}

function stationCard(s,rd){
  var h='<div class="card"><h3>Station '+s.number+' — '+s.emoji+' '+s.name+'</h3>';
  h+='<p style="color:var(--muted)"><i>'+s.question+'</i></p>';
  if(s.explanation)h+='<div class="box">'+s.explanation+'</div>';
  if(s.formula)h+='<p><span class="formula">'+TeX(s.formula)+'</span></p>';

  if(s.id==="data"){
    h+='<div class="box box-warn"><b>Step-by-step:</b> (1) Load '+rd.n_rows+' observations from the DGP. (2) Check positivity: PS in [0.01,0.99] → '+badge(String(rd.positivity_ok),rd.positivity_ok)+'. (3) Compute the rung-1 naive contrast vs. the known rung-2 truth.</div>';
    h+='<table>'+row("Sample size",rd.n_rows)+row("Positivity check",badge(String(rd.positivity_ok),rd.positivity_ok))+'</table>';
    h+='<table><tr><th>Contrast</th><th>Value</th><th>Rung</th></tr>';
    h+='<tr><td>Naive: P(Y|T=1) - P(Y|T=0)</td><td><b>'+fmt(rd.naive||0)+'</b></td><td>1 — seeing</td></tr>';
    h+='<tr><td>Causal: E[Y|do(T=1)] - E[Y|do(T=0)]</td><td><b>'+fmt(rd.truth||0)+'</b></td><td>2 — doing</td></tr>';
    h+='<tr><td><b>Confounding gap</b></td><td><b style="color:var(--red)">'+fmt(rd.gap||0)+'</b></td><td>—</td></tr></table>';
  }
  if(s.id==="assume"){
    h+='<div class="box"><b>Step-by-step:</b> (1) Enumerate all known variables (13 observed + 1 latent). (2) Draw each arrow based on domain knowledge. (3) Declare absent edges as falsifiable claims. (4) Version the graph (hash='+rd.graph_version+').</div>';
    h+='<table>'+row("Graph version","<code>"+rd.graph_version+"</code>")+row("Observed / Edges","13 / 20")+row("Absent edges","8 (falsifiable)")+'</table>';
  }
  if(s.id==="identify"){
    h+='<div class="box"><b>Step-by-step:</b> (1) Delete all edges OUT of T (back-door graph). (2) Search observed, non-descendant variable subsets. (3) Test d-separation via networkx. (4) Return smallest valid set.</div>';
    h+='<table>'+row("Criterion",rd.criterion)+row("Identified",badge("true",true))+'<tr><td><b>Adjustment set</b></td><td><code>'+(rd.adjustment_set||[]).join(", ")+'</code></td></tr></table>';
  }
  if(s.id==="feature"){
    h+='<div class="box"><b>Step-by-step:</b> (1) Start with the adjustment set. (2) Identify colliders (descendants of both T and Y) → exclude S. (3) Identify mediators (on T→Y path) → exclude M. (4) Identify instruments (affect T, no Y path) → Z.</div>';
    h+='<table>'+row("In adjustment","<code>"+(rd.adjustment_set||[]).join(", ")+"</code>")+row("Excluded (never adjust)","M (mediator), S (collider)")+row("Instruments","Z (send-time jitter)")+row("Negative controls","NC (battery drain)")+'</table>';
  }
  if(s.id==="model"){
    h+='<div class="box"><b>Step-by-step:</b> (1) Split data into 2 folds. (2) Fit propensity model P(T|X) on fold 1, evaluate on fold 2. (3) Fit outcome model E[Y|T,X] on fold 1, evaluate on fold 2. (4) Compute '+TeX("\\psi_i = \\hat\\mu_1 - \\hat\\mu_0 + \\frac{T_i(Y_i-\\hat\\mu_1)}{\\hat e_i} - \\frac{(1-T_i)(Y_i-\\hat\\mu_0)}{1-\\hat e_i}")+'. (5) ATE = mean(psi), SE = sd(psi)/sqrt(n).</div>';
    h+='<p style="font-size:.84rem;color:var(--muted)">Estimator: '+rd.estimator+'</p>';
    h+='<div class="metrics"><div class="metric"><div class="val">'+fmt(rd.ate)+'</div><div class="lbl">ATE</div></div>';
    h+='<div class="metric"><div class="val">['+fmt(rd.ci_low)+', '+fmt(rd.ci_high)+']</div><div class="lbl">95% CI</div></div>';
    h+='<div class="metric"><div class="val">'+fmt(rd.truth)+'</div><div class="lbl">Truth</div></div>';
    h+='<div class="metric"><div class="val">'+(cov(rd)?"PASS":"FAIL")+'</div><div class="lbl">CI Covers</div></div></div>';
  }
  if(s.id==="evaluate"){
    h+='<div class="metrics"><div class="metric"><div class="val">'+rd.e_value.toFixed(2)+'</div><div class="lbl">E-value</div></div>';
    h+='<div class="metric"><div class="val">'+rd.risk_ratio.toFixed(2)+'</div><div class="lbl">Risk Ratio</div></div>';
    h+='<div class="metric"><div class="val">'+rd.max_smd.toFixed(4)+'</div><div class="lbl">Max |SMD|</div></div></div>';
    h+='<p>E-value '+rd.e_value.toFixed(1)+': confounder needs RR ≥'+rd.e_value.toFixed(1)+' with both T and Y to explain away the effect.</p>';
  }
  if(s.id==="test"){
    h+='<div class="box"><b>Step-by-step:</b> (1) Placebo: randomly permute T → re-estimate → should be ~0. (2) RCC: add a random covariate → estimate should be stable. (3) Subset: estimate on 80% of data → should agree. (4) NC: estimate T→NC effect → should be ~null.</div>';
    h+='<table><tr><th>Refuter</th><th>Result</th><th>What it checks</th></tr>';
    var names=["Placebo treatment","Random common cause","Subset refuter","Negative control (NC)"];
    var checks=["Pipeline returns ~0 when T is random","Estimate is stable under added noise","80% sample agrees with full data","T→NC effect is ~null (residual confounding alarm)"];
    for(var j=0;j<4;j++)h+='<tr><td>'+names[j]+'</td><td class="'+(rd.all_green?"pass":"fail")+'">'+(rd.all_green?"PASS":"FAIL")+'</td><td style="font-size:.82rem;color:var(--muted)">'+checks[j]+'</td></tr>';
    h+='</table><p>'+badge("ALL GREEN: "+rd.all_green,rd.all_green)+'</p>';
  }
  h+="</div>";
  return h;
}

function buildSidebar(){
  var h='<h2>Causal Science</h2><div class="sub">A Guided Walkthrough</div>';
  h+='<div class="regime-badge">REGIME: '+activeRegime.toUpperCase()+'</div>';
  h+='<select onchange="switchRegime(this.value)"><option value="static"'+(activeRegime==="static"?" selected":"")+'>Static (baseline)</option><option value="holiday"'+(activeRegime==="holiday"?" selected":"")+'>Holiday (drifted)</option></select>';
  h+='<p style="font-size:.72rem;color:#95a5a6;margin-top:4px">Holiday: T→M coeff drops 1.6→0.4.<br>Y mechanism invariant.</p>';
  if(D&&D.content&&D.content.glossary){h+='<h3>Glossary</h3>';
    for(var i=0;i<D.content.glossary.length;i++){var g=D.content.glossary[i];h+='<div class="gt"><b>'+g.term+'</b> — '+g.def+'</div>';}}
  document.getElementById("sidebar").innerHTML=h;
}
function switchRegime(v){activeRegime=v;build()}
</script>
